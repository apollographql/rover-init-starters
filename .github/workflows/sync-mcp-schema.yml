name: Sync Apollo MCP Server Schema

on:
  # Run on a schedule (daily check)
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC

  # Allow manual trigger
  workflow_dispatch:

jobs:
  sync-schema:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # create-pull-request sets up its own credentials from `token:`.
          # Keeping the token out of .git/config means the npm tools below
          # cannot use it.
          persist-credentials: false

      - name: Get latest Apollo MCP Server release
        id: get-release
        env:
          # Authenticated requests avoid the anonymous API rate limit, which
          # previously made this step return "null" and open a broken PR.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh api repos/apollographql/apollo-mcp-server/releases/latest --jq '.tag_name')
          if ! [[ "$LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected release tag from GitHub API: '${LATEST}'"
            exit 1
          fi
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest version: $LATEST"

      - name: Get current schema version
        id: current-version
        run: |
          if [ -f "add-mcp/.vscode/schemas/VERSION" ]; then
            CURRENT=$(cat add-mcp/.vscode/schemas/VERSION)
          else
            CURRENT="none"
          fi
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT"

      - name: Check if update needed
        id: check-update
        env:
          LATEST: ${{ steps.get-release.outputs.version }}
          CURRENT: ${{ steps.current-version.outputs.version }}
        run: |
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "Update needed: $CURRENT -> $LATEST"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Schema is up to date"
          fi

          # Flag major version bumps so reviewers know to look closely.
          LATEST_MAJOR=$(echo "$LATEST" | sed -E 's/^v([0-9]+)\..*/\1/')
          CURRENT_MAJOR=$(echo "$CURRENT" | sed -E 's/^v([0-9]+)\..*/\1/')
          if [ "$LATEST_MAJOR" != "$CURRENT_MAJOR" ]; then
            echo "major=true" >> $GITHUB_OUTPUT
          else
            echo "major=false" >> $GITHUB_OUTPUT
          fi

      - name: Download new schema
        if: steps.check-update.outputs.needs_update == 'true'
        env:
          VERSION: ${{ steps.get-release.outputs.version }}
        run: |
          curl -fsSL -o /tmp/mcp-server.schema.json \
            "https://github.com/apollographql/apollo-mcp-server/releases/download/${VERSION}/config.schema.json"

          # Refuse to commit anything that is not a non-empty JSON object.
          if ! jq -e 'type == "object" and length > 0' /tmp/mcp-server.schema.json > /dev/null; then
            echo "::error::Downloaded schema for ${VERSION} is empty or not valid JSON"
            exit 1
          fi

          mv /tmp/mcp-server.schema.json add-mcp/.vscode/schemas/mcp-server.schema.json
          echo "$VERSION" > add-mcp/.vscode/schemas/VERSION

      # PRs opened with GITHUB_TOKEN do not trigger other workflows, so the
      # template validation is run here and its result is reported on the PR.
      - name: Setup Node.js
        if: steps.check-update.outputs.needs_update == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate MCP template YAML against new schema
        id: validate
        if: steps.check-update.outputs.needs_update == 'true'
        run: |
          npm install -g --ignore-scripts ajv-cli@5.0.0 ajv-formats@3.0.1 js-yaml@5.5.0
          STATUS=pass
          for file in add-mcp/.apollo/mcp.*.yaml; do
            [ -f "$file" ] || continue
            echo "Validating $file..."
            js-yaml "$file" > /tmp/config.json
            if ajv validate -s add-mcp/.vscode/schemas/mcp-server.schema.json \
                 --spec=draft2020 --strict=false -d /tmp/config.json; then
              echo "✓ $file is valid"
            else
              echo "::error file=$file::$file does not validate against the new schema"
              STATUS=fail
            fi
          done
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check-update.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1  # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update MCP server schema to ${{ steps.get-release.outputs.version }}"
          title: "Update MCP Server Schema to ${{ steps.get-release.outputs.version }}"
          body: |
            ## Automated Schema Update

            This PR updates the Apollo MCP Server configuration schema from `${{ steps.current-version.outputs.version }}` to `${{ steps.get-release.outputs.version }}`.

            **Release Notes:** https://github.com/apollographql/apollo-mcp-server/releases/tag/${{ steps.get-release.outputs.version }}

            ${{ steps.check-update.outputs.major == 'true' && '> [!WARNING]
            > This is a **major version** bump. Read the release notes for breaking config changes before merging.' || '' }}

            ### Changes
            - Updated `add-mcp/.vscode/schemas/mcp-server.schema.json` to official Apollo schema
            - Updated `add-mcp/.vscode/schemas/VERSION` to track current version

            ### Template validation
            `add-mcp/.apollo/mcp.*.yaml` against the new schema: **${{ steps.validate.outputs.status }}**

            If validation failed, fix the templates in a separate PR to `main`. This branch is rebuilt from `main` on every run, so commits pushed to it are overwritten.

            ### Testing
            - [ ] Verify schema validation works in VS Code
            - [ ] Check no false positives on existing template YAML files
          # Commit only the schema files, even if another step changed the workspace.
          add-paths: |
            add-mcp/.vscode/schemas/mcp-server.schema.json
            add-mcp/.vscode/schemas/VERSION
          # One rolling branch: a newer release updates this PR instead of opening another.
          # Each run rebuilds it from main, so do not push other commits to it.
          branch: update-mcp-schema
          delete-branch: true
          labels: dependencies, automated

      - name: Fail if templates do not validate
        if: steps.validate.outputs.status == 'fail'
        run: |
          echo "::error::Template YAML does not validate against ${{ steps.get-release.outputs.version }}. Fix add-mcp/.apollo/mcp.*.yaml in a separate PR to main. The update-mcp-schema branch is rebuilt from main on every run, so commits pushed to it are overwritten. After the fix merges, re-run this workflow to update and re-validate the PR."
          exit 1
